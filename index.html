<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .game-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            border: 4px solid #ffcc00;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Jogue Subway Surfers Grátis</h1>

    <div class="game-container">
        <!-- O link abaixo roda uma versão estável e limpa do jogo hospedada no GitHub -->
        <iframe src="https://subwaysurfers76.github.io/" allowfullscreen></iframe>
    </div>

</body>
</html>
